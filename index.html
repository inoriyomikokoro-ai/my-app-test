<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラダ労わりナビ - 身体の違和感・セルフケア・過ごし方アドバイス</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-50 min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-emerald-100">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goHome()">
                <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 text-white p-2.5 rounded-2xl shadow-md shadow-emerald-500/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">カラダ労わりナビ</h1>
                    <p class="text-xs text-slate-500">完全無料・オフライン対応のセルフケア手帳</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="app.openStorageGuide()" class="hidden sm:flex px-3 py-1.5 text-xs font-medium bg-teal-50 text-teal-700 rounded-xl hover:bg-teal-100 transition shadow-sm border border-teal-200/60 items-center gap-1">
                    <span>💾 保存先について</span>
                </button>
                <button onclick="app.openSafetyInfo()" class="px-3 py-1.5 text-xs font-medium bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 transition shadow-sm border border-emerald-200/60 flex items-center gap-1">
                    <span>🛡️ 安全ポリシー</span>
                </button>
                <button onclick="app.openDailyCheckin()" class="px-3 py-1.5 text-xs font-medium bg-emerald-100 text-emerald-800 rounded-xl hover:bg-emerald-200 transition shadow-sm">今日の体調記録</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 mb-12">
        <div id="app-container" class="fade-in">
            <!-- Dynamic content will be injected here -->
        </div>
    </main>

    <footer class="bg-white/60 border-t border-emerald-100 py-6 text-center text-xs text-slate-500 px-4">
        <div class="max-w-xl mx-auto space-y-1">
            <p class="font-semibold text-emerald-800">🔒 ネット接続不要・完全無料・広告なしで安全にご利用いただけます</p>
            <p>※本アプリは個人のセルフケアを目的としたものであり、医療診断や治療の代替にはなりません。症状が続く場合は医療機関にご相談ください。</p>
        </div>
    </footer>

    <script>
        // Database of symptoms, stretches, and lifestyle advice
        const symptomsData = [
            {
                id: 'neck_stiff',
                category: 'neck',
                name: '首・肩の重さ・コリ',
                icon: '👤',
                summary: '長時間のスマホやデスクワークによる緊張。血流不良が原因のことが多いです。',
                warning: '腕のしびれや突然の激しい頭痛がある場合は医療機関へ。',
                stretches: [
                    {
                        title: '首の横伸ばしストレッチ',
                        duration: '左右 各20秒',
                        steps: ['背筋をまっすぐ伸ばして座ります。', '右手を頭の左側に添え、ゆっくりと右斜め下に傾けます。', '首の左側が伸びているのを感じながら20秒キープ。反対側も同様に行います。'],
                        tip: '呼吸を止めず、痛気持ちいい強さで行いましょう。'
                    },
                    {
                        title: '肩甲骨まわし運動',
                        duration: '前後 各10回',
                        steps: ['両手を軽く肩に置きます。', '肘で大きな円を描くように、大きく後ろ向きに10回まわします。', '前向きにも同様に10回まわします。'],
                        tip: '胸を開くことを意識すると効果的です。'
                    }
                ],
                lifestyle: [
                    { title: 'デスクワークの姿勢', desc: '画面の上端が目の高さか、やや下になるように調整し、顎を軽く引く意識を。' },
                    { title: 'こまめな休憩', desc: '30分〜1時間に1回は背伸びをしたり、首を軽く動かして固まった筋肉をリセットしましょう。' },
                    { title: '入浴で温める', desc: 'シャワーだけで済ませず、39〜40℃のお湯に浸かって肩周りの血行を促しましょう。' }
                ]
            },
            {
                id: 'lower_back',
                category: 'back',
                name: '腰の重だるさ・ハリ',
                icon: '🧘',
                summary: '同じ姿勢の継続や骨盤周りの筋肉の硬さが主な原因です。',
                warning: '足のしびれや排尿障害を伴う場合は、早めに整形外科を受診してください。',
                stretches: [
                    {
                        title: '膝抱え腰伸ばし',
                        duration: '20〜30秒 × 2セット',
                        steps: ['仰向けに寝ころびます。', '両膝を抱え込み、胸の方へゆっくり引き寄せます。', '腰や背中が心地よく伸びるのを意識しながら、深呼吸を繰り返します。'],
                        tip: '腰を床に押し付けるようなイメージで行います。'
                    },
                    {
                        title: '猫と牛のポーズ（キャット＆カウ）',
                        duration: '5〜8回',
                        steps: ['四つんばいになり、手は肩幅、膝は腰幅に開きます。', '息を吐きながら背中を丸め、おへそを覗き込みます。', '息を吸いながら背中をそっと反らし、目線を斜め前に向けます。'],
                        tip: '背骨の柔軟性を高め、緊張を和らげます。'
                    }
                ],
                lifestyle: [
                    { title: '座りっぱなしを防ぐ', desc: 'クッションを活用したり、1時間に一度は立ち上がって軽く歩く習慣をつけましょう。' },
                    { title: '靴や椅子の見直し', desc: 'クッション性のある靴や、骨盤が立ちやすい椅子を選ぶと腰への負担が軽減します。' },
                    { title: '就寝時の工夫', desc: '横向きで寝る際は膝の間にクッションを挟むと、腰のねじれを防げます。' }
                ]
            },
            {
                id: 'eye_fatigue',
                category: 'head',
                name: '眼精疲労・頭の重さ',
                icon: '👀',
                summary: '画面の凝視やピント調節筋の疲労により、頭痛や肩こりを引き起こすことも。',
                warning: '視力の急激な低下や激しい頭痛を伴う場合は眼科受診をおすすめします。',
                stretches: [
                    {
                        title: '遠近フォーカス運動',
                        duration: '5往復',
                        steps: ['親指を目の前30cmほどに立ててじっと見つめます。', '次に、5m以上先の遠くの景色にピントを合わせます。', '手元と遠くを交互にゆっくり見つめます。'],
                        tip: '目のピント調節筋の緊張をほぐします。'
                    },
                    {
                        title: '側頭部（こめかみ）マッサージ',
                        duration: '30秒',
                        steps: ['両手の指の腹をこめかみ付近の側頭部に当てます。', '頭皮を引き上げるように、円を描く優しくマッサージします。'],
                        tip: '強く押しすぎず、イタ気持ちいい力加減で行います。'
                    }
                ],
                lifestyle: [
                    { title: '画面の明るさ・距離', desc: '部屋の明るさに合わせてディスプレイの輝度を調整し、画面から40cm以上離れましょう。' },
                    { title: 'ホットアイマスク', desc: '温かいタオルやホットアイマスクで目の周囲を温め、血行を促進させましょう。' },
                    { title: 'デジタルデトックス', desc: '就寝前30分はスマホやパソコンを見る時間を控え、脳と目を休ませましょう。' }
                ]
            },
            {
                id: 'leg_fatigue',
                category: 'leg',
                name: '足のむくみ・だるさ',
                icon: '🦵',
                summary: '長時間の立ち仕事や座りっぱなしによる血流・リンパの滞りが原因です。',
                warning: '片足だけが急に腫れたり痛む場合はエコノミークラス症候群や深部静脈血栓症に注意してください。',
                stretches: [
                    {
                        title: 'ふくらはぎのストレッチ',
                        duration: '左右 各20秒',
                        steps: ['壁に向かって立ち、片足を後ろに引きます。', '後ろの足の踵を床につけたまま、前の膝を曲げて壁に体重を預けます。', 'ふくらはぎがしっかり伸びるのを感じます。'],
                        tip: '下半身のポンプ機能をサポートします。'
                    },
                    {
                        title: '足首まわし＆足パカ',
                        duration: '左右各10回',
                        steps: ['仰向けになり、両足を持ち上げます。', '足首を大きく時計回し・反時計回しにそれぞれ10回まわします。'],
                        tip: '寝る前に行うと、翌朝スッキリしやすくなります。'
                    }
                ],
                lifestyle: [
                    { title: '就寝時の足枕', desc: '寝る時にクッションなどを使い、足を心臓より少し高い位置にして休むとむくみが和らぎます。' },
                    { title: 'こまめな水分補給', desc: '水分不足も巡りを悪くする原因。こまめな水分補給を心がけましょう。' },
                    { title: '着圧ソックスの活用', desc: '日中や就寝時に適切な着圧アイテムを使用するのも効果的です。' }
                ]
            },
            {
                id: 'mental_stress',
                category: 'mental',
                name: 'なんとなくの疲労感・息苦しさ',
                icon: '🍃',
                summary: '自律神経の乱れやストレスによる呼吸の浅さが影響していることがあります。',
                warning: '強い不安感が続く場合や胸の痛みが治まらない場合は専門医にご相談ください。',
                stretches: [
                    {
                        title: '深呼吸リセットストレッチ',
                        duration: '1〜2分',
                        steps: ['楽な姿勢で座り、鼻から4秒かけてゆっくり息を吸い込みます。', 'お腹を膨らませた後、4秒間息を止めます。', '口から8秒かけて細く長く息を吐ききります。'],
                        tip: '副交感神経を優位にし、心身をリラックスさせます。'
                    },
                    {
                        title: '胸開きリフレッシュ',
                        duration: '30秒',
                        steps: ['体の後ろで手を組み、肩甲骨をぐっと寄せます。', '息を吸いながら胸を大きく開き、天井を見上げます。'],
                        tip: '猫背で縮こまった胸郭を広げ、呼吸をしやすくします。'
                    }
                ],
                lifestyle: [
                    { title: 'ぬるめのお湯に浸かる', desc: '38〜40℃のぬるめのお湯にゆったり浸かることで、神経の緊張がほぐれます。' },
                    { title: '朝日を浴びる', desc: '朝起きたらカーテンを開けて日光を浴び、体内時計をリセットしましょう。' },
                    { title: '自分を労る時間', desc: '好きな音楽を聴く、温かいハーブティーを飲むなど、心落ち着く習慣を持ちましょう。' }
                ]
            }
        ];

        // App state
        class AppState {
            constructor() {
                this.currentView = 'home'; // home, detail, checkin, safety, storage
                this.selectedSymptom = null;
                this.history = JSON.parse(localStorage.getItem('self_care_history') || '[]');
            }

            navigate(view, symptomId = null) {
                this.currentView = view;
                if (symptomId) {
                    this.selectedSymptom = symptomsData.find(s => s.id === symptomId);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            goHome() {
                this.navigate('home');
            }

            openDetail(id) {
                this.navigate('detail', id);
            }

            openDailyCheckin() {
                this.navigate('checkin');
            }

            openSafetyInfo() {
                this.navigate('safety');
            }

            openStorageGuide() {
                this.navigate('storage');
            }

            saveCheckin(data) {
                this.history.unshift({
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    ...data
                });
                if (this.history.length > 10) this.history.pop();
                localStorage.setItem('self_care_history', JSON.stringify(this.history));
                this.goHome();
            }

            render() {
                const container = document.getElementById('app-container');
                if (this.currentView === 'home') {
                    container.innerHTML = this.renderHome();
                } else if (this.currentView === 'detail') {
                    container.innerHTML = this.renderDetail();
                } else if (this.currentView === 'checkin') {
                    container.innerHTML = this.renderCheckin();
                } else if (this.currentView === 'safety') {
                    container.innerHTML = this.renderSafety();
                } else if (this.currentView === 'storage') {
                    container.innerHTML = this.renderStorageGuide();
                }
            }

            renderHome() {
                return `
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl shadow-emerald-600/10 mb-8 relative overflow-hidden">
                        <div class="absolute right-0 top-0 translate-x-4 -translate-y-4 opacity-10 pointer-events-none">
                            <svg class="w-64 h-64" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </div>
                        <div class="max-w-xl relative z-10">
                            <div class="flex flex-wrap gap-2 mb-3">
                                <span class="inline-block bg-white/20 text-white text-xs px-3 py-1 rounded-full font-medium backdrop-blur-sm">🛡️ 完全無料・安全設計</span>
                                <span class="inline-block bg-emerald-700/50 text-emerald-100 text-xs px-3 py-1 rounded-full font-medium backdrop-blur-sm">📱 オフライン対応</span>
                                <span onclick="app.openStorageGuide()" class="inline-block bg-teal-800/60 text-teal-100 text-xs px-3 py-1 rounded-full font-medium backdrop-blur-sm cursor-pointer hover:bg-teal-700 transition">💾 データ保存・エクスポート</span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">今のカラダの違和感はどこですか？</h2>
                            <p class="text-emerald-100 text-sm sm:text-base leading-relaxed">お使いの端末内で安全に動作します。気になる部位を選んでストレッチと暮らしのアドバイスを確認しましょう。</p>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                            気になる違和感・お悩みを選ぶ
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${symptomsData.map(s => `
                                <div onclick="app.openDetail('${s.id}')" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md border border-emerald-100/60 hover:border-emerald-300 transition cursor-pointer group flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="text-3xl p-2.5 bg-emerald-50 rounded-2xl group-hover:scale-110 transition transform">${s.icon}</span>
                                            <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-2.5 py-1 rounded-full">ケアを見る →</span>
                                        </div>
                                        <h4 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-emerald-700 transition">${s.name}</h4>
                                        <p class="text-xs text-slate-500 leading-relaxed">${s.summary}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${this.history.length > 0 ? `
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-emerald-100/60 mb-8">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="text-md font-bold text-slate-800 flex items-center">
                                    <svg class="w-4 h-4 text-emerald-600 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    最近の体調記録履歴 (${this.history.length}件)
                                </h3>
                                <div class="flex items-center gap-2">
                                    <button onclick="app.exportText()" class="text-xs text-teal-700 hover:text-teal-800 font-medium bg-teal-50 hover:bg-teal-100 px-3 py-1.5 rounded-xl transition flex items-center gap-1 border border-teal-200">
                                        <span>📤 エクスポート</span>
                                    </button>
                                    <button onclick="app.clearHistory()" class="text-xs text-rose-600 hover:text-rose-700 font-medium bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl transition flex items-center gap-1 border border-rose-200">
                                        <span>🗑️ すべて消去</span>
                                    </button>
                                </div>
                            </div>
                            <div class="space-y-2 mb-3">
                                ${this.history.slice(0, 3).map(h => `
                                    <div class="flex items-center justify-between text-xs bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        <span class="text-slate-500 font-medium">${h.date}</span>
                                        <span class="font-bold text-slate-700">元気度: ${h.mood}/5</span>
                                        <span class="text-emerald-700 truncate max-w-[180px]">${h.memo || 'メモなし'}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="text-right">
                                <button onclick="app.openStorageGuide()" class="text-xs text-teal-700 hover:underline font-medium">
                                    ℹ️ データの保存場所・エクスポートについて詳しく見る →
                                </button>
                            </div>
                        </div>
                    ` : ''}
                `;
            }

            renderDetail() {
                const s = this.selectedSymptom;
                if (!s) return '';
                return `
                    <div class="mb-6">
                        <button onclick="app.goHome()" class="inline-flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-800 mb-4 bg-emerald-50 px-3 py-1.5 rounded-xl transition">
                            ← 症状一覧に戻る
                        </button>
                        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-emerald-100 flex items-start space-x-4">
                            <div class="text-4xl sm:text-5xl p-4 bg-emerald-50 rounded-2xl shrink-0">${s.icon}</div>
                            <div>
                                <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">${s.name}</h2>
                                <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-3">${s.summary}</p>
                                <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-xl flex items-start space-x-2">
                                    <svg class="w-4 h-4 text-amber-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    <div><span class="font-bold">注意点：</span>${s.warning}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2"></span>
                            おすすめセルフストレッチ
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${s.stretches.map((st, idx) => `
                                <div class="bg-white rounded-2xl p-6 shadow-sm border border-emerald-100 flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-center mb-3">
                                            <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">ストレッチ ${idx + 1}</span>
                                            <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">⏱️ ${st.duration}</span>
                                        </div>
                                        <h4 class="font-bold text-lg text-slate-800 mb-3">${st.title}</h4>
                                        <ol class="space-y-2 mb-4">
                                            ${st.steps.map((step, sIdx) => `
                                                <li class="text-xs sm:text-sm text-slate-600 flex items-start">
                                                    <span class="bg-emerald-100 text-emerald-800 font-bold rounded-full w-5 h-5 flex items-center justify-center text-[10px] mr-2 shrink-0 mt-0.5">${sIdx + 1}</span>
                                                    <span>${step}</span>
                                                </li>
                                            `).join('')}
                                        </ol>
                                    </div>
                                    <div class="bg-teal-50/60 p-3 rounded-xl text-xs text-teal-800 border border-teal-100">
                                        💡 <span class="font-semibold">コツ：</span>${st.tip}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                            <span class="w-2.5 h-2.5 rounded-full bg-teal-500 mr-2"></span>
                            今日からの過ごし方アドバイス
                        </h3>
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-100 space-y-4">
                            ${s.lifestyle.map((life, lIdx) => `
                                <div class="flex items-start space-x-4 p-4 rounded-2xl bg-slate-50/80 border border-slate-100">
                                    <div class="bg-emerald-500 text-white font-bold rounded-xl w-7 h-7 flex items-center justify-center shrink-0 text-xs shadow-sm">${lIdx + 1}</div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm sm:text-base mb-1">${life.title}</h4>
                                        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${life.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="text-center pt-4">
                        <button onclick="app.goHome()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-2xl shadow-md shadow-emerald-600/20 transition">
                            他の症状もチェックする
                        </button>
                    </div>
                `;
            }

            renderCheckin() {
                return `
                    <div class="max-w-lg mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-emerald-100">
                        <button onclick="app.goHome()" class="inline-flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-800 mb-4 bg-emerald-50 px-3 py-1.5 rounded-xl transition">
                            ← ホームに戻る
                        </button>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">今日の体調チェックイン</h2>
                        <p class="text-xs text-slate-500 mb-6">記録データはすべてお使いのブラウザ（ローカルストレージ）にのみ保存され、外部サーバーには送信されません。</p>

                        <form onsubmit="event.preventDefault(); app.handleCheckinSubmit(this);" class="space-y-6">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">今日の元気度 (1〜5)</label>
                                <div class="grid grid-cols-5 gap-2">
                                    ${[1, 2, 3, 4, 5].map(num => `
                                        <label class="cursor-pointer">
                                            <input type="radio" name="mood" value="${num}" ${num === 4 ? 'checked' : ''} class="peer sr-only">
                                            <div class="text-center py-3 rounded-2xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 font-bold transition">
                                                ${num === 1 ? '😫' : num === 2 ? '🥱' : num === 3 ? '😐' : num === 4 ? '😊' : '✨'}
                                                <div class="text-[10px] mt-1 text-slate-500">${num}</div>
                                            </div>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">メモ・気になったこと</label>
                                <textarea name="memo" rows="3" placeholder="例：デスクワークが長くて肩が凝った。今夜は湯船にゆっくり浸かろう。" class="w-full rounded-2xl border border-slate-200 p-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"></textarea>
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/20 transition">
                                記録を保存する（端末内に保存）
                            </button>
                        </form>
                    </div>
                `;
            }

            renderSafety() {
                return `
                    <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-emerald-100">
                        <button onclick="app.goHome()" class="inline-flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-800 mb-4 bg-emerald-50 px-3 py-1.5 rounded-xl transition">
                            ← ホームに戻る
                        </button>
                        <h2 class="text-2xl font-bold text-slate-800 mb-4 flex items-center">
                            <span class="mr-2">🛡️</span> 安全・プライバシーについて
                        </h2>
                        
                        <div class="space-y-4 text-xs sm:text-sm text-slate-600 leading-relaxed">
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <h3 class="font-bold text-emerald-900 text-sm mb-1">1. 完全無料・課金なし・広告なし</h3>
                                <p>このアプリは一切の課金要素、サブスクリプション、広告はありません。すべての機能を完全無料でお使いいただけます。</p>
                            </div>

                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <h3 class="font-bold text-emerald-900 text-sm mb-1">2. データ送信なし（高セキュリティ）</h3>
                                <p>お使いの端末内で安全に動作します。毎日の体調メモなどのプライベートな記録も外部に送信されず、あなたの端末内のみに保存されます。</p>
                            </div>

                            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-amber-900">
                                <h3 class="font-bold text-amber-900 text-sm mb-1">3. 安全なセルフケアのガイドライン</h3>
                                <p>紹介しているストレッチは痛みのない範囲（痛気持ちいい程度）で行うことを前提としています。無理な負荷をかけず、発熱や強いしびれ、激痛がある場合は直ちにご利用を中止し、医師の診断を受けてください。</p>
                            </div>
                        </div>

                        <div class="mt-6 text-center">
                            <button onclick="app.goHome()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-2xl shadow-md transition">
                                理解してホームに戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            renderStorageGuide() {
                return `
                    <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-emerald-100">
                        <button onclick="app.goHome()" class="inline-flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-800 mb-4 bg-emerald-50 px-3 py-1.5 rounded-xl transition">
                            ← ホームに戻る
                        </button>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 flex items-center">
                            <span class="mr-2">💾</span> データの保存・エクスポート機能
                        </h2>
                        <p class="text-xs text-slate-500 mb-6">ご自身の体調記録の保管方法や、テキストとしての保存について解説します。</p>

                        <div class="space-y-4 text-xs sm:text-sm text-slate-600 leading-relaxed">
                            <div class="bg-teal-50 p-4 rounded-2xl border border-teal-100">
                                <h3 class="font-bold text-teal-900 text-base mb-2">Q. 保存場所はどこですか？</h3>
                                <p class="text-slate-700">
                                    A. あなたが今お使いの<strong class="text-teal-800">スマホやパソコンのブラウザの中だけ（ローカルストレージ）</strong>に保存されます。外部サーバーには一切送信されません。
                                </p>
                            </div>

                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <h3 class="font-bold text-emerald-900 text-base mb-2">Q. エクスポート（書き出し）するとどうなりますか？</h3>
                                <p class="text-slate-700 mb-3">
                                    A. コード編集画面が開かないよう、<strong class="text-emerald-800">読みやすい普通のテキスト（文章）形式</strong>でコピーできるようにしています。下のボタンからスマホのメモ帳やLINEなどに簡単に貼り付けられます。
                                </p>
                                ${this.history.length > 0 ? `
                                    <div class="flex flex-wrap gap-2 pt-2">
                                        <button onclick="app.exportText()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-sm flex items-center gap-1">
                                            <span>📝 体調記録をテキストでコピーする</span>
                                        </button>
                                    </div>
                                ` : `
                                    <p class="text-xs text-slate-400 italic">現在エクスポートできる記録データはありません。（まずは「今日の体調記録」を入力してみてください）</p>
                                `}
                            </div>

                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <h3 class="font-bold text-slate-800 text-sm mb-1">🗑️ データのクリア（削除）について</h3>
                                <p class="mb-3">保存された記録は、いつでも完全に消去することができます。</p>
                                ${this.history.length > 0 ? `
                                    <button onclick="app.clearHistory(); app.goHome();" class="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 transition text-xs shadow-sm">
                                        🗑️ 保存されている記録をすべて消去する
                                    </button>
                                ` : `
                                    <p class="text-xs text-slate-400 italic">現在保存されている記録はありません。</p>
                                `}
                            </div>
                        </div>

                        <div class="mt-6 text-center">
                            <button onclick="app.goHome()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-2xl shadow-md transition">
                                確認してホームに戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            exportText() {
                if (this.history.length === 0) {
                    alert('エクスポートするデータがありません。');
                    return;
                }
                let textContent = "【カラダ労わりナビ 体調記録一覧】\n";
                textContent += `取得日時: ${new Date().toLocaleString('ja-JP')}\n----------------------------------\n\n`;
                this.history.forEach((h, i) => {
                    textContent += `■ 記録 ${i+1}\n`;
                    textContent += `・日時: ${h.date}\n`;
                    textContent += `・元気度: ${h.mood}/5\n`;
                    textContent += `・メモ: ${h.memo || 'なし'}\n\n`;
                });
                textContent += "----------------------------------\n※このテキストはスマホのメモ帳やLINEなどに貼り付けて保存できます。";
                
                const textArea = document.createElement('textarea');
                textArea.value = textContent;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('【コピー完了】\n体調記録のテキストをクリップボードにコピーしました！\n\nスマートフォンやパソコンの「メモ」アプリやLINEを開き、入力欄を長押し（またはCtrl+V）して「貼り付け」を行うことで保存できます。');
                } catch (err) {
                    alert('コピーに失敗しました。お使いのブラウザ設定をご確認ください。');
                }
                textArea.remove();
            }

            clearHistory() {
                if (confirm('保存されているすべての体調記録を消去してもよろしいですか？この操作は元に戻せません。')) {
                    this.history = [];
                    localStorage.removeItem('self_care_history');
                    this.render();
                }
            }

            handleCheckinSubmit(form) {
                const formData = new FormData(form);
                this.saveCheckin({
                    mood: formData.get('mood'),
                    memo: formData.get('memo')
                });
            }
        }

        // Initialize application instance
        const app = new AppState();
        window.onload = function() {
            app.render();
        };
    </script>
</body>
</html>
